version = 1

# Default for all files
# It is preferrable to use per-file annotations, which will override these entries
[[annotations]]
path = [
    # source and test code. Can be overridden on a per-file basis inside the file itself (which will supercede this)
    "src/**/*.ts",
    "test/**/*.ts",
    "src/**/*.json",
    "test/**/*.json",
    "src/**/*.jsonc",
    "global.d.ts",
    "plugins/**/*",
    # HTML / CSS at the top level, or in `tests`
    "*.html",
    "*.css",
    "test/**/*.html",
    "test/**/*.css",
    # Config files
    ".dependency-cruiser.cjs",
    # Json files that can't be commented
    "package.json",
    "tsconfig.json",
    "tsdoc.json",
    "typedoc.json",
    # environment files
    ".env",
    ".env.*",
    # Development files considered code
    ".vscode/*.json",
]
SPDX-FileCopyrightText = "2024-2025 Pagefault Games"
SPDX-License-Identifier = "AGPL-3.0-only"

# Files with no copyright
[[annotations]]
path = [
    # Git files
    "**/*.gitignore",
    "**/*.gitmodules",
    "**/*.gitattributes",
    "**/*.dockerignore",
    # Configuration files
    ".editorconfig",
    ".vscode/**/*.json",
    # any pokerogue save files for tests
    "**/*.prsv",
    # pnpm related files of insignificant originality
    "package-lock.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    # Miscellaneous files of insignificant originality
    ".nvmrc",
    "RELEASE",
    # patch files for broken packages
    "patches/*.patch"
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "NONE"

[[annotations]]
path = "favicon.ico"                        # Created by Gonstar (Paid Commission)
SPDX-FileCopyrightText = "2024 Gonstar"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# Local fork (2026-11-18): the IV Candy, EV item, Throat Spray, Z-Ring, Dynamax Candy and Z crystal icons are PokéSprite's
# 32x32 originals now (the main series' own art, like PokéRogue's other item icons; tools/port/install_pokesprite_icons.py
# outside the repository), so they fall under the assets' general annotation again

# Local fork (2026-11-11): Punching Glove / Master Punching Glove item icons, the Cobblemon 1.7.3 texture
# assets/cobblemon/textures/item/held_items/punching_glove.png scaled 2x; the Master one recoloured black with the Rogue
# Ball colours (tools/port_new_items_1111/make_icons.py). The user: "펀치글러브 아이콘은 코블버스 모드팩에서 빼오면 됩니다".
# Source: https://gitlab.com/cable-mc/cobblemon
